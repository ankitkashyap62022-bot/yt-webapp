<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ʏᴜᴋɪ ᴍᴀᴛʀɪx ᴩʟᴀʏᴇʀ</title>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- 🛠️ FIX: CSS me Cache buster laga diya -->
    <link rel="stylesheet" href="ui.css?v=2">
</head>
<body class="bg-[#050505] text-gray-200 h-screen flex flex-col overflow-hidden font-sans select-none">

    <header class="p-4 flex justify-between items-center z-10 bg-gradient-to-b from-purple-900/30 to-transparent">
        <h1 class="text-2xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-purple-400 to-cyan-400 drop-shadow-[0_0_12px_rgba(168,85,247,0.8)] tracking-wider">
            ʏᴜᴋɪ ᴍᴀᴛʀɪx
        </h1>

        <div class="flex items-center space-x-2 bg-black/60 p-1.5 rounded-full border border-gray-800 shadow-[0_0_10px_rgba(0,0,0,0.5)] backdrop-blur-md">
            <span class="text-[9px] pl-2 text-green-400 font-bold tracking-widest">ᴊɪᴏꜱᴀᴀᴠɴ</span>
            <label class="relative inline-flex items-center cursor-pointer">
                <input type="checkbox" id="api-switch" class="sr-only peer">
                <div class="w-8 h-4 bg-gray-700 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-3 after:w-3 after:transition-all peer-checked:bg-red-600"></div>
            </label>
            <span class="text-[9px] pr-2 text-gray-500 font-bold tracking-widest" id="yt-label">ʏᴏᴜᴛᴜʙᴇ</span>
        </div>
    </header>

    <main class="flex-1 overflow-y-auto pb-32 px-4 scrollbar-hide relative z-0" id="main-content">

        <section id="tab-search" class="w-full">
            <div class="relative w-full mb-6 mt-2 group">
                <i class="fa-solid fa-search absolute left-4 top-4 text-gray-400 group-focus-within:text-cyan-400 transition-colors"></i>
                <input type="text" id="search-input" class="w-full bg-gray-900/50 border border-gray-700 text-white rounded-2xl py-3.5 pl-12 pr-4 outline-none focus:border-cyan-400 focus:bg-gray-900/80 focus:shadow-[0_0_20px_rgba(34,211,238,0.2)] transition-all placeholder-gray-500 backdrop-blur-sm" placeholder="ꜱᴇᴀʀᴄʜ ꜱᴏɴɢꜱ, ᴀʀᴛɪꜱᴛꜱ...">
            </div>

            <h2 class="text-xs text-gray-500 mb-3 ml-1 font-semibold tracking-widest uppercase">ꜱᴇᴀʀᴄʜ ʀᴇꜱᴜʟᴛꜱ</h2>

            <ul id="search-results" class="space-y-2">
                <!-- Search results will load here -->
            </ul>
        </section>
    </main>

    <div id="mini-player" class="fixed bottom-[70px] left-2 right-2 bg-gray-900/95 backdrop-blur-xl border border-gray-800 rounded-xl p-2 flex items-center justify-between cursor-pointer shadow-[0_-5px_20px_rgba(0,0,0,0.5)] z-40 transition-transform">
        <div class="flex items-center space-x-3 overflow-hidden w-[70%]">
            <img id="mini-cover" src="https://i.scdn.co/image/ab67616d00001e021a8c4618eaa885af490c6a71" class="w-10 h-10 rounded-md object-cover">
            <div class="truncate">
                <h4 id="mini-title" class="text-white text-xs font-bold truncate">ᴛᴜᴍ ʜɪ ʜᴏ</h4>
                <p id="mini-artist" class="text-[10px] text-purple-400 truncate">ᴀʀɪᴊɪᴛ ꜱɪɴɢʜ</p>
            </div>
        </div>
        <div class="flex items-center space-x-4 pr-2">
            <i class="fa-regular fa-heart text-gray-400 hover:text-white transition"></i>
            <i id="mini-play-btn" class="fa-solid fa-play text-white text-lg"></i>
        </div>
        <div class="absolute bottom-0 left-2 right-2 h-[2px] bg-gray-800 rounded-full overflow-hidden">
            <div id="mini-progress" class="h-full bg-gradient-to-r from-purple-500 to-cyan-400 w-1/3 rounded-full"></div>
        </div>
    </div>

    <div id="full-player" class="fixed inset-0 bg-[#050505]/95 backdrop-blur-3xl z-50 flex flex-col transition-transform duration-500 translate-y-full">
        <div class="p-6 flex justify-between items-center mt-2">
            <i id="close-player-btn" class="fa-solid fa-chevron-down text-2xl text-gray-400 hover:text-white cursor-pointer transition"></i>
            <span class="text-[10px] text-cyan-400 font-bold tracking-[0.2em] uppercase shadow-cyan">ɴᴏᴡ ᴩʟᴀʏɪɴɢ</span>
            <i class="fa-solid fa-ellipsis-vertical text-xl text-gray-400 p-2"></i>
        </div>

        <div class="flex-1 flex flex-col items-center justify-center px-8 pb-12">
            <div class="relative w-full aspect-square mb-8">
                <div class="absolute inset-0 bg-purple-500/20 blur-3xl rounded-full"></div>
                <img id="player-cover" src="https://i.scdn.co/image/ab67616d00001e021a8c4618eaa885af490c6a71" class="relative w-full h-full object-cover rounded-[32px] shadow-[0_20px_50px_rgba(0,0,0,0.5)] border border-white/10">
            </div>

            <div class="w-full flex justify-between items-center mb-8">
                <div class="overflow-hidden pr-4">
                    <h2 id="player-title" class="text-2xl font-black text-white truncate tracking-wide">ᴛᴜᴍ ʜɪ ʜᴏ</h2>
                    <p id="player-artist" class="text-sm text-gray-400 mt-1 font-medium">ᴀʀɪᴊɪᴛ ꜱɪɴɢʜ</p>
                </div>
                <i class="fa-regular fa-heart text-2xl text-purple-400"></i>
            </div>

            <div class="w-full mb-8">
                <input type="range" id="seek-bar" class="w-full h-1.5 bg-gray-800 rounded-full appearance-none cursor-pointer outline-none accent-cyan-400 hover:accent-cyan-300 transition-all" value="0" max="100">
                <div class="flex justify-between text-[11px] text-gray-500 mt-3 font-semibold">
                    <span id="current-time">0:00</span>
                    <span id="total-time">0:00</span>
                </div>
            </div>

            <div class="w-full flex items-center justify-between px-1">
                <i class="fa-solid fa-shuffle text-lg text-gray-500 hover:text-white transition cursor-pointer"></i>
                <i id="prev-btn" class="fa-solid fa-backward-step text-3xl text-gray-300 hover:text-white transition cursor-pointer active:scale-90"></i>

                <div id="play-pause-btn" class="w-[85px] h-[85px] bg-gradient-to-br from-purple-600 to-cyan-500 rounded-full flex items-center justify-center shadow-[0_0_40px_rgba(168,85,247,0.4)] cursor-pointer active:scale-90 transition-transform">
                    <div class="w-[75px] h-[75px] bg-[#050505] rounded-full flex items-center justify-center">
                        <i id="play-icon" class="fa-solid fa-play text-2xl text-transparent bg-clip-text bg-gradient-to-r from-purple-400 to-cyan-400 ml-1"></i>
                    </div>
                </div>

                <i id="next-btn" class="fa-solid fa-forward-step text-3xl text-gray-300 hover:text-white transition cursor-pointer active:scale-90"></i>
                <i class="fa-solid fa-repeat text-lg text-gray-500 hover:text-white transition cursor-pointer"></i>
            </div>
        </div>
    </div>

    <nav class="fixed bottom-0 w-full bg-[#0a0a0a]/90 backdrop-blur-2xl border-t border-gray-900/50 flex justify-around items-center pb-6 pt-3 z-30">
        <div class="flex flex-col items-center text-gray-500 hover:text-white cursor-pointer transition">
            <i class="fa-solid fa-house text-[22px] mb-1.5"></i>
            <span class="text-[9px] font-bold tracking-wider">ʜᴏᴍᴇ</span>
        </div>
        <div class="flex flex-col items-center text-cyan-400 cursor-pointer drop-shadow-[0_0_10px_rgba(34,211,238,0.5)]">
            <i class="fa-solid fa-search text-[22px] mb-1.5"></i>
            <span class="text-[9px] font-bold tracking-wider">ꜱᴇᴀʀᴄʜ</span>
        </div>
        <div class="flex flex-col items-center text-gray-500 hover:text-white cursor-pointer transition">
            <i class="fa-solid fa-book-open text-[22px] mb-1.5"></i>
            <span class="text-[9px] font-bold tracking-wider">ʟɪʙʀᴀʀʏ</span>
        </div>
    </nav>

    <audio id="audio-engine"></audio>

    <!-- 🛠️ FIX: Saari JS files me Cache Buster (?v=2) laga diya -->
    <script src="api.js?v=2"></script>
    <script src="player.js?v=2"></script>
    <script src="audio.js?v=2"></script> 

</body>
</html>
