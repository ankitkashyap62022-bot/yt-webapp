<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ʏᴜᴋɪ ᴍᴀᴛʀɪx ᴩʟᴀʏᴇʀ</title>
    
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    
    <script src="https://cdn.tailwindcss.com"></script>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <link rel="stylesheet" href="ui.css">
</head>
<body class="bg-[#050505] text-gray-200 h-screen flex flex-col overflow-hidden yuki-font">

    <header class="p-4 flex justify-between items-center z-10 bg-gradient-to-b from-purple-900/40 to-transparent">
        <h1 class="text-2xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-purple-400 to-cyan-400 drop-shadow-[0_0_10px_rgba(168,85,247,0.8)]">
            ʏᴜᴋɪ ᴍᴀᴛʀɪx
        </h1>
        
        <div class="flex items-center space-x-2 bg-gray-900/80 p-1 rounded-full border border-gray-700">
            <span class="text-[10px] pl-2 text-green-400">ᴊɪᴏꜱᴀᴀᴠɴ</span>
            <label class="relative inline-flex items-center cursor-pointer">
                <input type="checkbox" id="api-switch" class="sr-only peer">
                <div class="w-9 h-5 bg-gray-700 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-4 after:w-4 after:transition-all peer-checked:bg-red-600"></div>
            </label>
            <span class="text-[10px] pr-2 text-gray-400" id="yt-label">ʏᴏᴜᴛᴜʙᴇ</span>
        </div>
    </header>

    <main class="flex-1 overflow-y-auto pb-24 px-4 scrollbar-hide" id="main-content">
        
        <section id="tab-search" class="w-full">
            <div class="relative w-full mb-6 mt-2">
                <i class="fa-solid fa-search absolute left-4 top-3.5 text-gray-400"></i>
                <input type="text" id="search-input" class="w-full bg-gray-900/60 border border-purple-500/30 text-white rounded-full py-3 pl-12 pr-4 outline-none focus:border-cyan-400 focus:shadow-[0_0_15px_rgba(34,211,238,0.4)] transition-all placeholder-gray-500" placeholder="ꜱᴇᴀʀᴄʜ ꜱᴏɴɢꜱ, ᴀʀᴛɪꜱᴛꜱ...">
            </div>
            
            <h2 class="text-sm text-gray-400 mb-3 ml-1">ꜱᴇᴀʀᴄʜ ʀᴇꜱᴜʟᴛꜱ</h2>
            <ul id="search-results" class="space-y-3">
                <li class="flex items-center justify-between p-2 hover:bg-white/5 rounded-xl transition cursor-pointer">
                    <div class="flex items-center space-x-3">
                        <img src="https://telegra.ph/file/default.jpg" class="w-12 h-12 rounded-md object-cover">
                        <div>
                            <h3 class="text-white text-sm font-semibold truncate w-40">ᴛᴜᴍ ʜɪ ʜᴏ</h3>
                            <p class="text-xs text-gray-400">ᴀʀɪᴊɪᴛ ꜱɪɴɢʜ</p>
                        </div>
                    </div>
                    <i class="fa-solid fa-ellipsis-vertical text-gray-500 p-2"></i>
                </li>
            </ul>
        </section>

    </main>

    <div id="full-player" class="fixed inset-0 bg-[#050505] z-50 flex flex-col transition-transform duration-500 translate-y-full">
        <div class="p-5 flex justify-between items-center">
            <i id="close-player-btn" class="fa-solid fa-chevron-down text-2xl text-gray-300 cursor-pointer p-2"></i>
            <span class="text-xs text-gray-400 tracking-widest">ɴᴏᴡ ᴩʟᴀʏɪɴɢ</span>
            <i class="fa-solid fa-ellipsis text-2xl text-gray-300 p-2"></i>
        </div>

        <div class="flex-1 flex flex-col items-center justify-center px-8 pb-10">
            <img id="player-cover" src="https://telegra.ph/file/default.jpg" class="w-full aspect-square object-cover rounded-3xl shadow-[0_10px_40px_rgba(168,85,247,0.3)] mb-8">
            
            <div class="w-full flex justify-between items-center mb-6">
                <div class="overflow-hidden">
                    <h2 id="player-title" class="text-2xl font-bold text-white truncate">ꜱᴇʟᴇᴄᴛ ᴀ ꜱᴏɴɢ</h2>
                    <p id="player-artist" class="text-gray-400 mt-1">ʏᴜᴋɪ ʀᴀᴅɪᴏ</p>
                </div>
                <i class="fa-regular fa-heart text-2xl text-gray-400"></i>
            </div>

            <div class="w-full mb-6">
                <input type="range" id="seek-bar" class="w-full h-1 bg-gray-700 rounded-lg appearance-none cursor-pointer outline-none" value="0" max="100">
                <div class="flex justify-between text-[10px] text-gray-400 mt-2">
                    <span id="current-time">0:00</span>
                    <span id="total-time">--:--</span>
                </div>
            </div>

            <div class="w-full flex items-center justify-between px-2">
                <i class="fa-solid fa-shuffle text-xl text-gray-400"></i>
                <i id="prev-btn" class="fa-solid fa-backward-step text-3xl text-white"></i>
                <div id="play-pause-btn" class="w-20 h-20 bg-gradient-to-tr from-purple-600 to-cyan-500 rounded-full flex items-center justify-center shadow-[0_0_30px_rgba(168,85,247,0.6)] cursor-pointer active:scale-95 transition">
                    <i id="play-icon" class="fa-solid fa-play text-2xl text-white ml-1"></i>
                </div>
                <i id="next-btn" class="fa-solid fa-forward-step text-3xl text-white"></i>
                <i class="fa-solid fa-repeat text-xl text-gray-400"></i>
            </div>
        </div>
    </div>

    <nav class="fixed bottom-0 w-full bg-black/80 backdrop-blur-md border-t border-gray-800 flex justify-around items-center pb-5 pt-3 z-40">
        <div class="flex flex-col items-center text-gray-500 hover:text-white cursor-pointer">
            <i class="fa-solid fa-house text-xl mb-1"></i>
            <span class="text-[9px]">ʜᴏᴍᴇ</span>
        </div>
        <div class="flex flex-col items-center text-white cursor-pointer">
            <i class="fa-solid fa-search text-xl mb-1 text-cyan-400 drop-shadow-[0_0_8px_rgba(34,211,238,0.8)]"></i>
            <span class="text-[9px] text-cyan-400">ꜱᴇᴀʀᴄʜ</span>
        </div>
        <div class="flex flex-col items-center text-gray-500 hover:text-white cursor-pointer">
            <i class="fa-solid fa-book-open text-xl mb-1"></i>
            <span class="text-[9px]">ʟɪʙʀᴀʀʏ</span>
        </div>
    </nav>

    <audio id="audio-engine"></audio>

</body>
</html>
