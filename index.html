<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ʏᴜᴋɪ ᴍᴀᴛʀɪx ᴩʀᴏ</title>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="ui.css?v=6">
    <style>
        /* Hide Scrollbar but keep functionality */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        /* Skeleton Animation */
        @keyframes shimmer { 100% { transform: translateX(100%); } }
        .skeleton { position: relative; overflow: hidden; background-color: #1f2937; }
        .skeleton::after {
            position: absolute; top: 0; right: 0; bottom: 0; left: 0;
            transform: translateX(-100%);
            background-image: linear-gradient(90deg, rgba(255, 255, 255, 0) 0, rgba(255, 255, 255, 0.05) 20%, rgba(255, 255, 255, 0.5) 60%, rgba(255, 255, 255, 0));
            animation: shimmer 1.5s infinite; content: '';
        }
    </style>
</head>
<body class="bg-[#050505] text-gray-200 h-screen flex flex-col overflow-hidden font-sans select-none">

    <header class="p-4 pt-5 flex justify-between items-center z-10 bg-[#050505]/90 backdrop-blur-xl border-b border-white/5 sticky top-0">
        <h1 class="text-2xl font-black text-transparent bg-clip-text bg-gradient-to-r from-purple-500 to-cyan-400 drop-shadow-[0_0_15px_rgba(168,85,247,0.5)] tracking-widest uppercase">
            ʏᴜᴋɪ<span class="text-white font-light">ᴍᴀᴛʀɪx</span>
        </h1>

        <div class="flex items-center space-x-3 bg-white/5 p-1.5 rounded-full border border-white/10 shadow-[0_0_15px_rgba(0,0,0,0.8)] backdrop-blur-md">
            <span class="text-[10px] pl-2 text-cyan-400 font-bold tracking-widest" id="saavn-label">JIOSAAVN</span>
            <label class="relative inline-flex items-center cursor-pointer">
                <input type="checkbox" id="api-switch" class="sr-only peer">
                <div class="w-10 h-5 bg-gray-800 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-4 after:w-4 after:transition-all peer-checked:bg-gradient-to-r peer-checked:from-red-600 peer-checked:to-red-800 shadow-inner"></div>
            </label>
            <span class="text-[10px] pr-2 text-gray-500 font-bold tracking-widest transition-colors" id="yt-label">YOUTUBE</span>
        </div>
    </header>

    <main class="flex-1 overflow-y-auto pb-36 scrollbar-hide relative z-0 no-scrollbar" id="main-content">
        
        <section class="w-full px-4 pt-4">
            <div class="relative w-full mb-4 group z-20">
                <div class="absolute inset-y-0 left-0 flex items-center pl-4 pointer-events-none">
                    <i class="fa-solid fa-search text-gray-500 group-focus-within:text-cyan-400 transition-colors text-lg"></i>
                </div>
                <input type="text" id="search-input" class="w-full bg-[#121212] border border-white/10 text-white rounded-2xl py-4 pl-12 pr-12 outline-none focus:border-cyan-500 focus:bg-[#1a1a1a] focus:shadow-[0_0_25px_rgba(34,211,238,0.15)] transition-all placeholder-gray-600 font-medium tracking-wide shadow-lg" placeholder="Search songs, artists, podcasts...">
                <div class="absolute inset-y-0 right-0 flex items-center pr-4">
                    <i id="clear-search" class="fa-solid fa-times-circle text-gray-600 hover:text-white cursor-pointer hidden transition-colors"></i>
                </div>
            </div>

            <div class="flex space-x-3 overflow-x-auto no-scrollbar mb-6 pb-2">
                <span class="px-5 py-1.5 bg-white text-black text-[11px] font-bold rounded-lg whitespace-nowrap cursor-pointer hover:scale-105 transition-transform">All</span>
                <span class="px-5 py-1.5 bg-white/10 text-gray-300 text-[11px] font-bold rounded-lg whitespace-nowrap border border-white/5 cursor-pointer hover:bg-white/20 transition-all">Music</span>
                <span class="px-5 py-1.5 bg-white/10 text-gray-300 text-[11px] font-bold rounded-lg whitespace-nowrap border border-white/5 cursor-pointer hover:bg-white/20 transition-all">Live Sets</span>
                <span class="px-5 py-1.5 bg-white/10 text-gray-300 text-[11px] font-bold rounded-lg whitespace-nowrap border border-white/5 cursor-pointer hover:bg-white/20 transition-all">Trending</span>
            </div>

            <div id="empty-state" class="flex flex-col items-center justify-center mt-12 opacity-50">
                <i class="fa-brands fa-space-awesome text-6xl text-gray-700 mb-4 drop-shadow-xl"></i>
                <h3 class="text-lg font-bold text-gray-400 tracking-wider">ENTER THE MATRIX</h3>
                <p class="text-xs text-gray-600 mt-1">Search to unleash the music</p>
            </div>

            <div id="loading-skeleton" class="hidden w-full flex-col space-y-4 mt-2">
                <div class="saavn-skeleton flex items-center space-x-4 p-2">
                    <div class="w-14 h-14 rounded-lg skeleton"></div>
                    <div class="flex-1 space-y-2">
                        <div class="h-3 bg-gray-800 rounded w-3/4 skeleton"></div>
                        <div class="h-2 bg-gray-800 rounded w-1/2 skeleton"></div>
                    </div>
                </div>
                <div class="yt-skeleton hidden flex-col space-y-3 p-2">
                    <div class="w-full h-48 rounded-xl skeleton"></div>
                    <div class="flex space-x-3">
                        <div class="w-10 h-10 rounded-full skeleton"></div>
                        <div class="flex-1 space-y-2 py-1">
                            <div class="h-3 bg-gray-800 rounded w-5/6 skeleton"></div>
                            <div class="h-2 bg-gray-800 rounded w-2/3 skeleton"></div>
                        </div>
                    </div>
                </div>
            </div>

            <ul id="jiosaavn-results" class="space-y-1.5 transition-opacity duration-300"></ul>

            <div id="youtube-results" class="hidden flex-col space-y-6 transition-opacity duration-300"></div>

            <div id="scroll-anchor" class="w-full h-12 mt-4 flex items-center justify-center">
                <div id="scroll-spinner" class="hidden items-center space-x-2 bg-black/50 px-4 py-2 rounded-full border border-gray-800">
                    <i class="fa-solid fa-spinner fa-spin text-cyan-400 text-sm"></i>
                    <span class="text-[10px] font-bold text-gray-400 tracking-widest uppercase">Loading More...</span>
                </div>
            </div>

        </section>
    </main>

    <div id="mini-player" class="fixed bottom-[80px] left-3 right-3 bg-gray-900/90 backdrop-blur-2xl border border-white/10 rounded-2xl p-2.5 flex items-center justify-between cursor-pointer shadow-[0_10px_30px_rgba(0,0,0,0.8)] z-40 transition-transform hover:bg-gray-800/90 group overflow-hidden">
        <div class="flex items-center space-x-3.5 overflow-hidden w-[65%] z-10">
            <div class="relative">
                <img id="mini-img" src="https://i.scdn.co/image/ab67616d00001e021a8c4618eaa885af490c6a71" class="w-11 h-11 rounded-lg object-cover shadow-md group-hover:scale-105 transition-transform duration-300">
                <div class="absolute inset-0 bg-black/20 rounded-lg"></div>
            </div>
            <div class="truncate">
                <h4 id="mini-title" class="text-white text-[13px] font-extrabold truncate tracking-wide drop-shadow-md">Yuki Matrix</h4>
                <p id="mini-artist" class="text-[10px] text-cyan-400 font-semibold truncate mt-0.5">System Ready</p>
            </div>
        </div>
        <div class="flex items-center space-x-5 pr-3 z-10">
            <i class="fa-solid fa-chromecast text-gray-400 hover:text-white transition text-sm"></i>
            <i id="mini-play-btn" class="fa-solid fa-play text-white text-xl drop-shadow-[0_0_8px_rgba(255,255,255,0.5)] active:scale-90 transition-transform"></i>
        </div>
        <div class="absolute bottom-0 left-0 right-0 h-1 bg-gray-800/50">
            <div id="mini-progress" class="h-full bg-gradient-to-r from-purple-500 via-cyan-400 to-blue-500 w-0 relative shadow-[0_0_10px_rgba(34,211,238,0.8)] transition-all duration-300"></div>
        </div>
    </div>

    <div id="full-player" class="fixed inset-0 bg-[#050505] z-50 flex flex-col transition-transform duration-500 translate-y-full">
        <div class="absolute inset-0 z-0 overflow-hidden">
            <img id="player-bg-blur" src="https://i.scdn.co/image/ab67616d00001e021a8c4618eaa885af490c6a71" class="w-full h-full object-cover opacity-30 blur-[80px] scale-110">
            <div class="absolute inset-0 bg-gradient-to-b from-[#050505]/40 via-[#050505]/80 to-[#050505]"></div>
        </div>

        <div class="p-6 pt-12 flex justify-between items-center z-10 relative">
            <div id="close-player-btn" class="w-10 h-10 flex items-center justify-center rounded-full bg-white/5 hover:bg-white/10 border border-white/5 cursor-pointer backdrop-blur-md transition-all active:scale-90">
                <i class="fa-solid fa-chevron-down text-lg text-white"></i>
            </div>
            <div class="flex flex-col items-center">
                <span class="text-[9px] text-gray-400 font-bold tracking-[0.3em] uppercase">Playing from</span>
                <span id="player-source-label" class="text-[11px] text-cyan-400 font-bold tracking-widest mt-0.5 shadow-cyan">MATRIX SERVER</span>
            </div>
            <div class="w-10 h-10 flex items-center justify-center rounded-full bg-white/5 hover:bg-white/10 border border-white/5 cursor-pointer backdrop-blur-md transition-all">
                <i class="fa-solid fa-ellipsis-vertical text-lg text-white"></i>
            </div>
        </div>

        <div class="flex-1 flex flex-col items-center justify-center px-8 pb-10 z-10 relative">
            <div class="relative w-full max-w-[320px] aspect-square mb-10 group">
                <div class="absolute inset-0 bg-gradient-to-tr from-purple-600/30 to-cyan-500/30 blur-3xl rounded-full opacity-50 group-hover:opacity-80 transition-opacity duration-700"></div>
                <img id="fs-img" src="https://i.scdn.co/image/ab67616d00001e021a8c4618eaa885af490c6a71" class="relative w-full h-full object-cover rounded-3xl shadow-[0_20px_50px_rgba(0,0,0,0.6)] border border-white/10 z-10">
            </div>

            <div class="w-full flex justify-between items-end mb-8">
                <div class="overflow-hidden pr-4 flex-1">
                    <h2 id="fs-title" class="text-3xl font-black text-white truncate tracking-tight drop-shadow-md">Yuki Matrix</h2>
                    <p id="fs-artist" class="text-base text-gray-400 mt-1.5 font-medium truncate">System Ready</p>
                </div>
                <i class="fa-regular fa-heart text-3xl text-gray-500 hover:text-purple-400 hover:scale-110 transition-all cursor-pointer mb-1"></i>
            </div>

            <div class="w-full mb-8 group">
                <input type="range" id="seek-bar" class="w-full h-2 bg-gray-800/80 rounded-full appearance-none cursor-pointer outline-none accent-white group-hover:accent-cyan-400 transition-all" value="0" max="100">
                <div class="flex justify-between text-[12px] text-gray-400 mt-3 font-semibold font-mono">
                    <span id="current-time">0:00</span>
                    <span id="total-time">0:00</span>
                </div>
            </div>

            <div class="w-full max-w-[300px] flex items-center justify-between px-2">
                <i class="fa-solid fa-shuffle text-xl text-gray-500 hover:text-white transition cursor-pointer active:scale-90"></i>

                <i id="prev-btn" onclick="playPrev()" class="fa-solid fa-backward-step text-4xl text-white hover:text-cyan-200 transition cursor-pointer active:scale-90 drop-shadow-md"></i>

                <div id="play-pause-btn" class="w-[85px] h-[85px] bg-white rounded-full flex items-center justify-center shadow-[0_0_30px_rgba(255,255,255,0.3)] cursor-pointer active:scale-95 transition-transform hover:scale-105">
                    <i id="play-icon" class="fa-solid fa-play text-3xl text-black ml-1"></i>
                </div>

                <i id="next-btn" onclick="playNext()" class="fa-solid fa-forward-step text-4xl text-white hover:text-cyan-200 transition cursor-pointer active:scale-90 drop-shadow-md"></i>

                <i class="fa-solid fa-repeat text-xl text-gray-500 hover:text-white transition cursor-pointer active:scale-90"></i>
            </div>
        </div>
    </div>

    <nav class="fixed bottom-0 w-full bg-[#050505]/95 backdrop-blur-3xl border-t border-white/5 flex justify-around items-center pb-6 pt-4 z-30 shadow-[0_-10px_30px_rgba(0,0,0,0.5)]">
        <div class="flex flex-col items-center text-gray-500 hover:text-white cursor-pointer transition-colors group">
            <i class="fa-solid fa-house text-[22px] mb-1.5 group-hover:-translate-y-1 transition-transform"></i>
            <span class="text-[9px] font-bold tracking-wider">HOME</span>
        </div>
        <div class="flex flex-col items-center text-white cursor-pointer drop-shadow-[0_0_15px_rgba(255,255,255,0.3)] group relative">
            <div class="absolute -top-6 bg-cyan-500 w-12 h-1 rounded-full shadow-[0_0_10px_rgba(34,211,238,0.8)]"></div>
            <i class="fa-solid fa-search text-[22px] mb-1.5 group-hover:-translate-y-1 transition-transform text-cyan-400"></i>
            <span class="text-[9px] font-bold tracking-wider text-cyan-400">SEARCH</span>
        </div>
        <div class="flex flex-col items-center text-gray-500 hover:text-white cursor-pointer transition-colors group">
            <i class="fa-solid fa-bars-staggered text-[22px] mb-1.5 group-hover:-translate-y-1 transition-transform"></i>
            <span class="text-[9px] font-bold tracking-wider">LIBRARY</span>
        </div>
    </nav>

    <audio id="audio-engine"></audio>

    <script src="audio.js?v=6"></script> 
    <script src="player.js?v=6"></script>
    <script src="api.js?v=6"></script>

</body>
</html>
